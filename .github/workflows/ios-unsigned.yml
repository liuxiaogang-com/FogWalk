name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'FogWalk/**'
      - 'FogWalkTests/**'
      - 'FogWalk.xcodeproj/**'
      - 'FogWalk-Info.plist'
      - 'scripts/ci-*.sh'
      - 'scripts/ci-*.py'
      - '.github/workflows/ios-unsigned.yml'
  workflow_dispatch:
    inputs:
      validation_mode:
        description: 'full: run tests and publish Release; build-only: IPA artifact without tests or Release'
        type: choice
        default: full
        options:
          - full
          - build-only

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CI_VALIDATION_MODE: ${{ inputs.validation_mode || 'full' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Start simulator while device IPA builds
        if: env.CI_VALIDATION_MODE == 'full'
        run: bash scripts/ci-prepare-simulator.sh
      - name: Build and package unsigned device IPA
        id: ipa
        run: bash scripts/ci-build-unsigned.sh
      - name: Upload IPA and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.ipa.outputs.artifact_name }}
          path: |
            .build/unsigned/*.ipa
            .build/unsigned/*.sha256
            .build/unsigned/build-info.json
          if-no-files-found: error
          retention-days: 30
      - name: Run tests without private location fixtures
        if: env.CI_VALIDATION_MODE == 'full'
        run: bash scripts/ci-test.sh
      - name: Publish persistent GitHub Release
        if: success() && env.CI_VALIDATION_MODE == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TEST_STATUS: passed
        run: python3 scripts/ci-publish-release.py .build/unsigned
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            .build/*.log
            .build/Tests.xcresult
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
